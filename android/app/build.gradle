plugins {
    id 'com.android.application'
}

def buildNumber = System.getenv('GITHUB_RUN_NUMBER')?.toInteger() ?: 1

android {
    namespace 'za.nikeelnaidoo.satriviashowdown.tv'
    compileSdk 35

    defaultConfig {
        applicationId 'za.nikeelnaidoo.satriviashowdown.tv'
        minSdk 21
        targetSdk 35
        versionCode buildNumber
        versionName "1.0.${buildNumber}"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
